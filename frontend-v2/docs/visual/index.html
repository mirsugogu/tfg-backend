<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPTIMA · Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
        },
        colors: {
          navy: {
            50:  '#f3f5fa',
            100: '#e6ebf4',
            200: '#c7d1e5',
            300: '#9aabcd',
            400: '#6b80ad',
            500: '#4a6090',
            600: '#384a73',
            700: '#2a3a5e',
            800: '#1f2c4a',
            850: '#172238',
            900: '#111a2e',
            950: '#0b1322',
          },
        },
        boxShadow: {
          card: '0 2px 12px -2px rgba(15, 23, 42, 0.06)',
          float: '0 12px 40px -12px rgba(15, 23, 42, 0.15)',
        }
      },
    },
  };
</script>
<style>
  html, body { font-family: 'DM Sans', system-ui, sans-serif; background: #f4f7fe; }
  body { color: #1f2c4a; }
  /* hide scrollbar but keep functionality on sidebar */
  .nice-scroll::-webkit-scrollbar { width: 6px; }
  .nice-scroll::-webkit-scrollbar-track { background: transparent; }
  .nice-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 9999px; }
  @keyframes fade-in-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .anim-in { animation: fade-in-up .35s ease both; }
</style>
</head>
<body class="min-h-screen">
