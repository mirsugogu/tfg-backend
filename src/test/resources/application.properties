# ========================================
# Configuracion exclusiva para tests (@SpringBootTest).
# Spring Boot la carga automaticamente cuando hay tests en classpath y
# sobreescribe los valores de src/main/resources/application.properties.
# El runtime real (mvnw spring-boot:run, docker compose) sigue usando MySQL.
#
# Por que H2 + MODE=MySQL:
#   - mvnw test debe pasar sin necesidad de Docker ni MySQL local.
#   - El schema se genera desde las entidades JPA (ddl-auto=create-drop),
#     asi no dependemos de tener docs/schema_v18.sql aplicado.
#   - MODE=MySQL hace que H2 tolere la sintaxis MySQL que pueda aparecer
#     en JPQL/queries nativas.
# ========================================

spring.datasource.url=jdbc:h2:mem:optima_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mail desactivado en tests (las pruebas no envian correos reales).
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
app.mail.from=test-no-reply@optima.local

# JWT con clave dummy (>= 32 chars para que JwtUtil.@PostConstruct no falle).
app.jwt.secret=ClaveDePruebasSoloParaTestsUnitariosDeOptimaApp2026!
app.jwt.expiration-ms=3600000

# Geocoding desactivado en tests (no llamamos a Nominatim).
app.geocoding.user-agent=optima-test/1.0
app.geocoding.timeout-ms=1000
