# ========================================
# Application
# ========================================
spring.application.name=api
server.port=8080

# ========================================
# Database (local development)
# El puerto se controla con la variable de entorno DB_PORT:
#   - sin definirla  -> 3306 (MySQL instalado de forma nativa, sin Docker).
#   - DB_PORT=3307   -> MySQL en Docker + backend nativo (mapea 3307 al host).
# Con 'docker compose up' completo esta URL se ignora: el contenedor `api`
# define SPRING_DATASOURCE_URL apuntando a `mysqldb:3306` (red interna).
# ========================================

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/optima_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
spring.datasource.username=optima_user
spring.datasource.password=optima_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# Paginacion (Spring Data Web)
# default-page-size: tamano por defecto si el cliente no envia ?size=N.
# max-page-size: techo de seguridad para evitar ?size=99999999.
# ========================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ========================================
# JWT
# app.jwt.secret: clave HMAC para firmar tokens. Sin fallback a proposito:
#   si JWT_SECRET no esta definida en el entorno, la app NO arranca
#   (JwtUtil.@PostConstruct valida >= 32 caracteres). Patron 12-factor:
#   el secreto vive fuera del binario, en .env (local) o en el gestor
#   de configuracion del proveedor cloud (AWS Systems Manager Parameter
#   Store, etc.) en produccion. Generar uno propio segun .env-example.
# app.jwt.expiration-ms: duracion del token (14400000 ms = 4 h). Limite
#   duro, no se renueva con actividad. Compromiso entre seguridad
#   (reducir la ventana de uso de un token robado) y usabilidad (evitar
#   re-login cada pocos minutos). Refresh tokens fuera del alcance del TFG.
# ========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:14400000}

# ========================================
# CORS
# Lista separada por comas de origenes permitidos para llamadas
# desde browser (preflight CORS). Fallback de desarrollo cubre:
#   - http://localhost:5173, http://127.0.0.1:5173 -> servidor Vite del
#     frontend web (y su alias por IP).
#   - http://localhost, https://localhost           -> WebView de la app
#     movil empaquetada con Capacitor (Android usa scheme http por
#     defecto, iOS y Android con server.androidScheme=https usan https).
# Sobreescribir con CORS_ALLOWED_ORIGINS en otros entornos (separar por
# comas, sin barra final). En produccion AWS la env var apunta al
# dominio publico real (ej. https://optima.example.com).
# ========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost}

# ========================================
# Mail (Gmail SMTP)
# Requiere cuenta Gmail con 2FA activado y App Password (16 chars).
# Generar la App Password en: https://myaccount.google.com/apppasswords
# Definir MAIL_USERNAME y MAIL_PASSWORD en .env (cargado por docker-compose)
# o como variables de entorno del shell en arranque directo.
# app.mail.from es el remitente que vera el destinatario (puede coincidir
# con MAIL_USERNAME o usar un alias si tu cuenta tiene "Send as" configurado).
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:no-reply@optima.local}

# ========================================
# Frontend
# app.frontend.url se usa para construir enlaces en los emails (por
# ejemplo el enlace a la pantalla de restablecer contrasena). En
# desarrollo apunta al servidor de Vite; sobreescribir con la variable
# de entorno FRONTEND_URL en otros entornos. Sin barra final.
# ========================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ========================================
# Geocoding (Nominatim / OpenStreetMap)
# ========================================
app.geocoding.user-agent=optima-tfg/1.0 (contacto: diegoalejandrobarrero@gmail.com)
app.geocoding.timeout-ms=5000

# ========================================
# OpenAPI / Swagger
# UI navegable disponible en http://localhost:8080/swagger-ui.html
# JSON OpenAPI 3.0 disponible en http://localhost:8080/v3/api-docs
# operations-sorter=method ordena los endpoints por verbo HTTP.
# tags-sorter=alpha ordena los grupos (controllers) alfabeticamente.
#
# Toggle SWAGGER_ENABLED: si esta a false, springdoc no registra ni el
# JSON OpenAPI ni la UI (las rutas devuelven 404). En produccion se
# desactiva (SWAGGER_ENABLED=false) para reducir superficie de
# exposicion: Postman es la fuente canonica de la documentacion del
# API y publicar la lista de endpoints + DTOs facilita el trabajo a
# un atacante.
# ========================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha