# Aplicacion
spring.application.name=api
server.port=8080

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/optima_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
spring.datasource.username=optima_user
spring.datasource.password=optima_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Paginacion por defecto de los endpoints que usan Pageable
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:14400000}

# Origenes permitidos para llamadas desde navegador
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost}

# Correo saliente por Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:no-reply@optima.local}

# URL base del frontend para enlaces enviados por email
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Geocoding (Nominatim / OpenStreetMap)
app.geocoding.user-agent=optima-tfg/1.0 (contacto: diegoalejandrobarrero@gmail.com)
app.geocoding.timeout-ms=5000

# OpenAPI / Swagger
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha