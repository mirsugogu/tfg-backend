# ========================================
# Application
# ========================================
spring.application.name=api
server.port=8080

# ========================================
# Database (local development)
# Docker maps MySQL to port 3307 on the host
# ========================================

spring.datasource.url=jdbc:mysql://localhost:3307/optima_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=optima_user
spring.datasource.password=optima_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================
# Seguridad y arranque
# Movidas desde ApiApplication.java al hacer el main limpio.
# - allow-bean-definition-overriding: permite redefinir beans (evita 403 en arranque).
# ========================================
spring.main.allow-bean-definition-overriding=true

# ========================================
# JWT - PLACEHOLDER, replace with a strong secret later
# ========================================
app.jwt.secret=${JWT_SECRET:EstaEsUnaClaveSuperSecretaYMuyLargaParaQueNoExplote2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ========================================
# Geocoding (Nominatim / OpenStreetMap)
# ========================================
app.geocoding.user-agent=optima-tfg/1.0 (contacto: diegoalejandrobarrero@gmail.com)
app.geocoding.timeout-ms=5000